
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1F3864;
        }

        .carousel {
            max-width: 1000px;
            margin: 0 auto;
        }

        .slides {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
        }

        .slide {
            position: absolute;
            inset: 0;
            margin: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slide figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 24px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .prev {
            left: 8px;
        }

        .next {
            right: 8px;
        }

        .dots {
            text-align: center;
            padding: 12px 0;
        }

        .dot {
            width: 12px;
            height: 12px;
            margin: 0 5px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #b8b8b8;
            cursor: pointer;
        }

        .dot.active {
            background: #1F3864;
        }
    </style>
</head>

<body>

    <h1>MY PICTURES</h1>

    <div class="carousel" id="carousel">

        <div class="slides">

            <figure class="slide active">
                <img src="Pic1.jpg" alt="Bird">
                <figcaption>bIrd with a bIg I-s</figcaption>
            </figure>

            <figure class="slide">
                <img src="Pic2.jpg" alt="Pink Flower">
                <figcaption>Flower na Pink</figcaption>
            </figure>

            <figure class="slide">
                <img src="Pic3.jpg" alt="Long Hair Dog">
                <figcaption>Long Hair Doggie</figcaption>
            </figure>

            <figure class="slide">
                <img src="Pic4.jpg" alt="Beagle">
                <figcaption>Soft Beagle</figcaption>
            </figure>

            <button class="nav prev" type="button">
                &#10094;
            </button>

            <button class="nav next" type="button">
                &#10095;
            </button>

        </div>

        <div class="dots"></div>

    </div>

    <script>
        const carousel = document.getElementById("carousel");
        const slides = carousel.querySelectorAll(".slide");
        const dotsBox = carousel.querySelector(".dots");

        let current = 0;
        let timer;

        // Create dots
        slides.forEach((slide, index) => {
            const dot = document.createElement("button");

            dot.className = "dot";
            dot.type = "button";
            dot.setAttribute("aria-label", "Go to slide " + (index + 1));

            dot.addEventListener("click", () => {
                showSlide(index);
                restartAutoplay();
            });

            dotsBox.appendChild(dot);
        });

        const dots = dotsBox.querySelectorAll(".dot");

        // Display selected slide
        function showSlide(index) {
            slides[current].classList.remove("active");
            dots[current].classList.remove("active");

            current = (index + slides.length) % slides.length;

            slides[current].classList.add("active");
            dots[current].classList.add("active");
        }

        // Next and previous buttons
        function nextSlide() {
            showSlide(current + 1);
        }

        function prevSlide() {
            showSlide(current - 1);
        }

        carousel.querySelector(".next").addEventListener("click", () => {
            nextSlide();
            restartAutoplay();
        });

        carousel.querySelector(".prev").addEventListener("click", () => {
            prevSlide();
            restartAutoplay();
        });

        // Automatic slideshow
        function startAutoplay() {
            clearInterval(timer);
            timer = setInterval(nextSlide, 4000);
        }

        function restartAutoplay() {
            startAutoplay();
        }

        // Pause when mouse enters
        carousel.addEventListener("mouseenter", () => {
            clearInterval(timer);
        });

        carousel.addEventListener("mouseleave", startAutoplay);

        // Keyboard controls
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight") {
                nextSlide();
                restartAutoplay();
            }

            if (event.key === "ArrowLeft") {
                prevSlide();
                restartAutoplay();
            }
        });

        // Initial slide
        dots[0].classList.add("active");
        startAutoplay();

    </script>

</body>
</html>
