<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <link rel="stylesheet" href="indexStyle.css">
    <script src="indexScript.js" defer></script>

</head>
<body>
    <center>
        <h1>Drag And Drop API</h1>
    </center>
    <div class = "draggableContainer">
        <div class ="draggable" draggable="true" id="draggable">draggable1</div>
        <div class ="draggable" draggable="true" id="draggable">draggable2</div>
        <div class ="draggable" draggable="true" id="draggable">draggable3</div>
        <div class ="draggable" draggable="true" id="draggable">draggable4</div>
        <div class ="draggable" draggable="true" id="draggable">draggable5</div>
    </div>
        <div class = "droppableContainer">
        <div class ="droppable"  data-draggable-id  id="draggable">droppable1</div>
        <div class ="droppable"  data-draggable-id  id="draggable">droppable2</div>
        <div class ="droppable"  data-draggable-id  id="draggable">droppable3</div>
        <div class ="droppable"  data-draggable-id  id="draggable">droppable4</div>
        <div class ="droppable"  data-draggable-id  id="draggable">droppable5</div>
    </div>
    
</body> 
</html>
