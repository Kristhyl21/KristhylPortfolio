<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline</title>
</head>
<body>
       <form>
            <table border="1" cellpadding="10" cellspacing="0"></table>
            <thead>
                <tr>
                            <h2><center>Form Elements</center></h2>
                    </td>
                </tr>
            </thead>
            <tbody>
     <!-- Row 1: A label for Username; and an input field (type="text") with a placeholder="Enter Username" -->
                  <tr>
                    <td colspan="3" style ="padding-bottom: 15px;border: none;">
                 <label for="user-name" style="color:slateblue;font-family:sans-serif;">Username:</label>
            
                    <input type="text"
                   id="user-name"
                   name="user_name"
                   placeholder="Enter Username">
                    </td>
                   </tr>

    <!-- Row 2: A label for Password; and an input field (type="password") with a placeholder="Enter Password" -->
                   <tr>
                   <td colspan="3" style="padding-bottom: 15px;border:none;" >
                 <label for="user-password" style="color:slateblue;font-family:sans-serif;">Password:</label>
                    
                 <input type="password"
                   id="user-password"
                   name="user_password"
                   placeholder="Enter Password">
                 </td>
                 </tr>
            </tbody>
</body>
</html>
