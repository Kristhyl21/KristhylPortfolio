<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technova Solutions-Employee Portal Login</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
     
    <title>Portal Login</title>
</head>
<body>
   
    <form>
        <table align="center" border-collapse: collapse; border="3px solid slateblue">
            <thead>
                <tr>
                    <td colspan="2" style="color: white; background-color: slateblue;font-family: sans-serif;">
                        <h2><center>Portal Login</center></h2>
                    </td>
                </tr>
            </thead>
            <tbody>
     <!-- Row 1: A label for Username; and an input field (type="text") with a placeholder="Enter Username" -->
                  <tr>
                    <td colspan="3" style ="padding-bottom: 15px;border: none;">
                 <label for="user-name" style="color:slateblue;font-family:sans-serif;">Username:</label>
            
                    <input type="text"
                   id="user-name"
                   name="user_name"
                   style="border:2px solid slateblue"
                   placeholder="Enter Username">
                    </td>
                   </tr>

    <!-- Row 2: A label for Password; and an input field (type="password") with a placeholder="Enter Password" -->
                   <tr>
                   <td colspan="3" style="padding-bottom: 15px;border:none;" >
                 <label for="user-password" style="color:slateblue;font-family:sans-serif;">Password:</label>
                    
                 <input type="password"
                   id="user-password"
                   name="user_password"
                   style="border:2px solid slateblue"
                   placeholder="Enter Password">
                 </td>
                 </tr>
            </tbody>
            <tfoot>
                <tr>
                     <td align="center" style="padding-top: 15px;border: none;">
                      <input type="submit" value="Submit" style="background-color: darkslateblue;color: white;">
                     
                       <input type="reset" value="Reset" style="background-color: slateblue;color:white;">
                     </td>
                     
                </tr>
                <tr>
                    <td colspan="2" style="padding-top: 15px;border: none;color: slateblue;">
                        <h5><center>Created by: Kristhyl Anne Morales 
                    12- Cooper</center></h5></td>
                    
                </tr>
            </tfoot>
        </table>
    </form>

</body>
</html>
