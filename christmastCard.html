<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> My Digital Christmas Card </title>
    <style>
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        canvas {
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<canvas id="myChristmasCard" width="800" height="550"></canvas>

<script>
    const canvas = document.getElementById('myChristmasCard');
    const ctx = canvas.getContext('2d');

    // 1. CARD BACKGROUND
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(800, 0);
    ctx.lineTo(800, 550);
    ctx.lineTo(0, 550);
    ctx.closePath();
    ctx.fillStyle = "#f0f4f8";
    ctx.fill();

    // 2. TWO-LINE BORDER (Drawn manually using moveTo and lineTo)
    function drawTwoLineBorder() {
        // Outer Border Line
        ctx.beginPath();
        ctx.moveTo(15, 15);
        ctx.lineTo(785, 15);
        ctx.lineTo(785, 535);
        ctx.lineTo(15, 535);
        ctx.closePath();
        ctx.strokeStyle = "#1e3a8a";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Inner Border Line
        ctx.beginPath();
        ctx.moveTo(22, 22);
        ctx.lineTo(778, 22);
        ctx.lineTo(778, 528);
        ctx.lineTo(22, 528);
        ctx.closePath();
        ctx.strokeStyle = "#3b82f6";
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
    drawTwoLineBorder();

    // 3. CHRISTMAS TREE
    // Trunk
    ctx.beginPath();
    ctx.moveTo(560, 480);
    ctx.lineTo(580, 480);
    ctx.lineTo(580, 400);
    ctx.lineTo(560, 400);
    ctx.closePath();
    ctx.fillStyle = "#1e3a8a";
    ctx.fill();

    // Bottom Tier
    ctx.beginPath();
    ctx.moveTo(450, 420);
    ctx.lineTo(690, 420);
    ctx.lineTo(570, 290);
    ctx.closePath();
    ctx.fillStyle = "#3b82f6";
    ctx.fill();

    // Middle Tier
    ctx.beginPath();
    ctx.moveTo(480, 310);
    ctx.lineTo(660, 310);
    ctx.lineTo(570, 190);
    ctx.closePath();
    ctx.fillStyle = "#2563eb";
    ctx.fill();

    // Top Tier
    ctx.beginPath();
    ctx.moveTo(510, 210);
    ctx.lineTo(630, 210);
    ctx.lineTo(570, 110);
    ctx.closePath();
    ctx.fillStyle = "#1d4ed8";
    ctx.fill();

    // 4. SNOWMAN
    // Bottom Body Snowball
    ctx.beginPath();
    ctx.arc(690, 410, 60, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#93c5fd";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Middle Body Snowball
    ctx.beginPath();
    ctx.arc(690, 315, 43, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.stroke();

    // Head Snowball
    ctx.beginPath();
    ctx.arc(690, 245, 30, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.stroke();

    // 2 Buttons on Middle Body
    ctx.beginPath();
    ctx.arc(690, 302, 3, 0, Math.PI * 2);
    ctx.arc(690, 330, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#1e3a8a";
    ctx.fill();

    // 2 Buttons on Lower Body
    ctx.beginPath();
    ctx.arc(690, 390, 3, 0, Math.PI * 2);
    ctx.arc(690, 420, 3, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.beginPath();
    ctx.arc(680, 238, 3, 0, Math.PI * 2);
    ctx.arc(700, 238, 3, 0, Math.PI * 2);
    ctx.fill();

    // Carrot Nose (Pointing Right)
    ctx.beginPath();
    ctx.moveTo(690, 243);
    ctx.lineTo(716, 248);
    ctx.lineTo(690, 253);
    ctx.closePath();
    ctx.fillStyle = "#60a5fa";
    ctx.fill();

    // Scarf Wrap
    ctx.beginPath();
    ctx.moveTo(660, 267);
    ctx.lineTo(720, 267);
    ctx.lineTo(720, 282);
    ctx.lineTo(660, 282);
    ctx.closePath();
    ctx.fillStyle = "#1e40af";
    ctx.fill();

    // Scarf Tail
    ctx.beginPath();
    ctx.moveTo(700, 282);
    ctx.lineTo(716, 282);
    ctx.lineTo(716, 330);
    ctx.lineTo(700, 330);
    ctx.closePath();
    ctx.fill();

    // 5. GIFTS WITH RIBBONS AND BOWS
    // Gift Box 1 (Left / Rear)
    ctx.beginPath();
    ctx.moveTo(380, 480);
    ctx.lineTo(450, 480);
    ctx.lineTo(450, 410);
    ctx.lineTo(380, 410);
    ctx.closePath();
    ctx.fillStyle = "#60a5fa";
    ctx.fill();
    ctx.strokeStyle = "#1e3a8a";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Gift 1 Vertical Ribbon
    ctx.beginPath();
    ctx.moveTo(411, 480);
    ctx.lineTo(419, 480);
    ctx.lineTo(419, 410);
    ctx.lineTo(411, 410);
    ctx.closePath();
    ctx.fillStyle = "#1d4ed8";
    ctx.fill();

    // Gift 1 Horizontal Ribbon
    ctx.beginPath();
    ctx.moveTo(380, 441);
    ctx.lineTo(450, 441);
    ctx.lineTo(450, 449);
    ctx.lineTo(380, 449);
    ctx.closePath();
    ctx.fill();

    // Gift 1 Top Bow Loops
    ctx.beginPath();
    ctx.arc(407, 404, 8, 0, Math.PI * 2);
    ctx.arc(423, 404, 8, 0, Math.PI * 2);
    ctx.strokeStyle = "#1d4ed8";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Gift Box 2 (Right / Front)
    ctx.beginPath();
    ctx.moveTo(430, 485);
    ctx.lineTo(500, 485);
    ctx.lineTo(500, 425);
    ctx.lineTo(430, 425);
    ctx.closePath();
    ctx.fillStyle = "#3b82f6";
    ctx.fill();
    ctx.strokeStyle = "#1e3a8a";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Gift 2 Vertical Ribbon
    ctx.beginPath();
    ctx.moveTo(461, 485);
    ctx.lineTo(469, 485);
    ctx.lineTo(469, 425);
    ctx.lineTo(461, 425);
    ctx.closePath();
    ctx.fillStyle = "#bfdbfe";
    ctx.fill();

    // Gift 2 Horizontal Ribbon
    ctx.beginPath();
    ctx.moveTo(430, 451);
    ctx.lineTo(500, 451);
    ctx.lineTo(500, 459);
    ctx.lineTo(430, 459);
    ctx.closePath();
    ctx.fill();

    // Gift 2 Top Bow Loops
    ctx.beginPath();
    ctx.arc(457, 419, 7, 0, Math.PI * 2);
    ctx.arc(473, 419, 7, 0, Math.PI * 2);
    ctx.strokeStyle = "#bfdbfe";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 6. LARGER SCRIPT GREETING TEXT & LINES
    ctx.font = "italic bold 64px 'Brush Script MT', 'Dancing Script', cursive";
    ctx.fillStyle = "#1e3a8a";
    ctx.fillText("Merry", 80, 115);
    ctx.fillText("Christmas!", 60, 180);

    ctx.font = "italic bold 24px Georgia, serif";
    ctx.fillStyle = "#1d4ed8";
    ctx.fillText("to:", 70, 280);

    ctx.beginPath();
    ctx.moveTo(120, 280);
    ctx.lineTo(340, 280);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#3b82f6";
    ctx.stroke();

    ctx.fillText("from:", 70, 380);

    ctx.beginPath();
    ctx.moveTo(150, 380);
    ctx.lineTo(340, 380);
    ctx.stroke();

    // 7. Random Blue Circles / Snow Effect
    function draw20BlueCircles() {
        for (let i = 0; i < 35; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const radius = Math.random() * 5 + 1;
            const hue = Math.floor(Math.random() * 40) + 195;
            const lightness = Math.floor(Math.random() * 50) + 35;
            
            ctx.fillStyle = "hsl(" + hue + ", 85%, " + lightness + "%)";
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    draw20BlueCircles();

</script>
</body>
</html>
