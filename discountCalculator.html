<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Calculator</title>
  
  <style>
    :root {
      --primary: #2563eb;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --bg-main: #fafafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --focus-ring: rgba(37, 99, 235, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    #container {
      max-width: 400px;
      margin: 60px auto 20px auto;
      padding: 28px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    output {
      display: block;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 1rem;
    }

    input[type="number"],
    input[type="button"],
    input[type="reset"] {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input[type="number"] {
      border: 1.5px solid var(--border);
      color: var(--text-main);
      background-color: #fff;
      outline: none;
      margin-bottom: 12px;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    input[type="button"] {
      background-color: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2);
      margin-bottom: 8px;
    }

    input[type="button"]:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 8px rgba(249, 115, 22, 0.3);
    }

    input[type="button"]:active {
      transform: translateY(1px);
    }

    input[type="reset"] {
      background-color: #64748b;
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    input[type="reset"]:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <form>
    <div id="container">
      <h3>Discount Calculator</h3>

      <label for="price">Price before discount</label>
      <input type="number" id="price" step="0.01" min="0">

      <label for="discount">Discount (%)</label>
      <input type="number" id="discount" step="0.01" min="0" max="100">

      <label for="price-after">Price after discount</label>
      <output id="priceAfter">&#8369; 0.00</output>

      <label for="saved-amount">Saved amount</label>
      <output id="savedAmount">&#8369; 0.00</output>

      <input type="button" id="btnCompute" value="Compute">
      <input type="reset" id="btnReset" value="Reset">

      <label>Programmed by: Kristhyl Anne Morales 12-Cooper</label>
    </div>
  </form>

  <script>
    const thePrice = document.getElementById("price");
    const theDiscount = document.getElementById("discount");
    const priceAfterOutput = document.getElementById("priceAfter");
    const savedAmountOutput = document.getElementById("savedAmount");
    const theButton = document.getElementById("btnCompute");
    const resetButton = document.getElementById("btnReset");

    function computeDiscount() {
      const priceVal = parseFloat(thePrice.value) || 0;
      const discountVal = parseFloat(theDiscount.value) || 0;

      const savedAmount = priceVal * (discountVal / 100);
      const priceAfter = priceVal - savedAmount;

      priceAfterOutput.innerHTML = "&#8369; " + priceAfter;
      savedAmountOutput.innerHTML = "&#8369; " + savedAmount;
    }

    function resetForm() {
      priceAfterOutput.innerHTML = "&#8369; 0.00";
      savedAmountOutput.innerHTML = "&#8369; 0.00";
    }

    theButton.addEventListener('click', computeDiscount);
    resetButton.addEventListener('click', resetForm);
  </script>

</body>
</html>
